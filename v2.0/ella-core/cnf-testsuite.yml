config_version: "v2"
deployments:
  helm_dirs:
    - name: ella-v122
      helm_directory: ./ella-core
      namespace: ella-cnti-v122
      helm_values: >-
        -f ./test-values.yaml
        --set image=ghcr.io/ellanetworks/ella-core:v1.22.0
        --set kubernetesHardening.enabled=true
        --set network.type=pod
        --set controller.enabled=false
        --set troubleshooting.enabled=false
        --set resources.limits.cpu=2
